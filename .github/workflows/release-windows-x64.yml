name: Release Windows x64

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (for example: v1.0.0)"
        required: true
      prerelease:
        description: "Mark the release as prerelease"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup MSVC developer command prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Run type check
        run: bunx tsc --noEmit

      - name: Build Windows x64 release
        run: bunx electrobun build --targets=win-x64

      - name: Collect release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $releaseDir = Join-Path $PWD "release-assets"

          if (Test-Path $releaseDir) {
            Remove-Item -Recurse -Force $releaseDir
          }

          New-Item -ItemType Directory -Path $releaseDir | Out-Null

          $artifactRoots = @("artifacts", "build") | Where-Object { Test-Path $_ }
          $patterns = @("*.exe", "*.msi", "*.zip", "*.tar.gz", "*.tar.zst")
          $files = @()

          foreach ($root in $artifactRoots) {
            foreach ($pattern in $patterns) {
              $files += Get-ChildItem -Path $root -Recurse -File -Filter $pattern -ErrorAction SilentlyContinue
            }
          }

          $files = $files | Sort-Object -Property FullName -Unique

          if ($files.Count -eq 0) {
            Write-Host "Searched roots: $($artifactRoots -join ', ')"
            throw "No packaged Windows release assets were found."
          }

          foreach ($file in $files) {
            Copy-Item -LiteralPath $file.FullName -Destination (Join-Path $releaseDir $file.Name)
          }

          Get-ChildItem -Path $releaseDir -File | Select-Object Name, Length

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: act-track-ai-md-win-x64
          path: release-assets/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: act-track-ai-md-win-x64
          path: release-assets

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: release-assets/*
          generate_release_notes: true
          prerelease: ${{ github.event.inputs.prerelease || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') || contains(github.event.inputs.tag, '-alpha') || contains(github.event.inputs.tag, '-beta') || contains(github.event.inputs.tag, '-rc') }}
