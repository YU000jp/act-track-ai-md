name: Release Windows x64

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (for example: v1.0.0)"
        required: true
      checkout_ref:
        description: "Branch, tag, or commit to build from. Leave blank to use the workflow ref."
        required: false
        default: ""
      prerelease:
        description: "Mark the release as prerelease"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      checkout_ref: ${{ steps.meta.outputs.checkout_ref }}

    steps:
      - name: Determine release metadata
        id: meta
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if [[ "${{ github.event.inputs.prerelease }}" == "true" ]] || [[ "$TAG" =~ -(alpha|beta|rc)(\.|$) ]]; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi

          CHECKOUT_REF_INPUT="${{ github.event.inputs.checkout_ref || '' }}"
          if [[ -n "$CHECKOUT_REF_INPUT" ]]; then
            if [[ "$CHECKOUT_REF_INPUT" =~ ^refs/tags/(.+)$ ]]; then
              CHECKOUT_TAG="${BASH_REMATCH[1]}"
              if [[ "$CHECKOUT_TAG" != "$TAG" ]]; then
                echo "checkout_ref tag ($CHECKOUT_TAG) must match release tag ($TAG)." >&2
                exit 1
              fi
            elif [[ "$CHECKOUT_REF_INPUT" =~ ^v.+$ ]] && [[ "$CHECKOUT_REF_INPUT" != "$TAG" ]]; then
              echo "checkout_ref tag ($CHECKOUT_REF_INPUT) must match release tag ($TAG)." >&2
              exit 1
            fi
          fi

          # Keep release naming on the requested tag, but allow the build source ref
          # to be selected independently for manual dispatches.
          if [[ -n "$CHECKOUT_REF_INPUT" ]]; then
            CHECKOUT_REF="$CHECKOUT_REF_INPUT"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            CHECKOUT_REF="$GITHUB_REF"
          else
            CHECKOUT_REF="refs/tags/$TAG"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "checkout_ref=$CHECKOUT_REF" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0

      - name: Setup MSVC developer command prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Run type check
        run: pnpm run typecheck

      - name: Build Windows x64 release
        run: pnpm run build:release

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: act-track-ai-md-win-x64
          path: release-assets/*
          if-no-files-found: error

  release:
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest

    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: act-track-ai-md-win-x64
          path: release-assets

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: release-assets/*
          generate_release_notes: true
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
