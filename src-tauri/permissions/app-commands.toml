[[permission]]
identifier = "app-commands"
description = "Allow the dashboard window to call the application's Tauri commands."
commands.allow = [
  "get_today_summary",
  "get_top_apps",
  "get_statistics_snapshot",
  "get_timeline",
  "get_daily_summary",
  "get_settings",
  "get_tracking_status",
  "get_dashboard_bootstrap",
  "set_setting",
  "set_settings",
  "get_setting",
  "generate_summary_now",
  "save_summary_feedback",
  "get_memory_status",
  "get_memory_snapshot",
  "list_memories",
  "forget_memory",
  "pin_memory",
  "toggle_tracking"
]
